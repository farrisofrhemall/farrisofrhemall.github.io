<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ADHD Herbalist | Premium Coaching & Botanical Scaffolding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

    <style>
        :root {
            /* Luxury Holistic Dark-Mode Palette */
            --slate-deep: #0f172a;      /* Main Background Deep Space */
            --slate-card: #1e293b;      /* Glassmorphism Card Container Fill */
            --teal-light: #2dd4bf;      /* Neon Therapeutic Accent Color */
            --teal-glow: #0d9488;       /* Deeper Branding Core Interface Fill */
            --coral-excite: #f97316;    /* Behavioral CTA Urgency Focus Highlight */
            --coral-hover: #ea580c;     /* Darker Coral for Hover Micro-Transitions */
            --sage-soothe: #86efac;     /* Nervous System Calibration Color Indicator */
            --text-main: #f8fafc;       /* Crisp High Contrast Primary Body Copy */
            --text-muted: #94a3b8;      /* Structural Label and Supporting Descriptions */
            --border-glow: rgba(45, 212, 191, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--slate-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        /* Nav Bar Construction */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--teal-light);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--teal-light);
        }

        /* Core Buttons Archetypes */
        .cta-btn {
            background: linear-gradient(135deg, var(--coral-excite), var(--coral-hover));
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(249, 115, 22, 0.4);
        }

        .sec-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 1.8rem;
            font-weight: 500;
            font-size: 0.95rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sec-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--teal-light);
        }

        /* Hero Wrapper */
        .hero-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 8% 4rem 8%;
            position: relative;
        }

        .hero-content {
            max-width: 850px;
            text-align: center;
            z-index: 10;
        }

        .badge {
            background: rgba(45, 212, 191, 0.08);
            color: var(--teal-light);
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 50px;
            border: 1px solid var(--border-glow);
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
        }

        .hero-content h1 em {
            font-style: normal;
            background: linear-gradient(to right, #2dd4bf, #86efac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .button-cluster {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
        }

        /* Premium Structural Dashboard Grid Layer */
        .dashboard-section {
            padding: 4rem 8% 8rem 8%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.4rem;
            letter-spacing: -0.5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 3.5rem;
            align-items: start;
        }

        /* Left Side: Modular Widgets Layout */
        .widget-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .premium-card {
            background-color: var(--slate-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .premium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }

        /* Quiz Widget Stylings */
        .quiz-container h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
