<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ADHD Herbalist | Thrive with Neurodiversity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --teal-calm: #0d9488;
            --teal-light: #2dd4bf;
            --coral-excite: #f97316;
            --coral-hover: #ea580c;
            --sage-soothe: #86efac;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--teal-light);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--coral-excite);
        }

        /* Hero Landing */
        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
            background: radial-gradient(circle at 80% 20%, rgba(13, 148, 136, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(249, 115, 22, 0.1) 0%, transparent 50%);
        }

        .hero-content {
            max-width: 800px;
        }

        .badge {
            background: rgba(13, 148, 136, 0.2);
            color: var(--teal-light);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            border: 1px solid var(--teal-calm);
            font-weight: 600;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .highlight-text {
            background: linear-gradient(to right, var(--teal-light), var(--coral-excite));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        /* Buttons */
        .cta-btn {
            background-color: var(--coral-excite);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            background-color: var(--coral-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.6);
        }

        .secondary-btn {
            background: transparent;
            color: var(--teal-light);
            border: 2px solid var(--teal-calm);
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            margin-left: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
        }

        .secondary-btn:hover {
            background: rgba(13, 148, 136, 0.1);
            border-color: var(--teal-light);
        }

        /* Visual Graphic Styling */
        .visual-container {
            width: 100%;
            height: 350px;
            margin: 2rem 0;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .visual-overlay-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--coral-excite);
        }

        /* Core Structure */
        section {
            padding: 5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 4rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Bio Layout */
        .bio-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: center;
        }

        .bio-image {
            width: 100%; 
            max-height: 500px; 
            object-fit: cover; 
            border-radius: 24px; 
            border: 4px solid var(--teal-calm);
            background-color: var(--bg-card);
        }

        .bio-text p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .bio-text strong {
            color: var(--text-light);
        }

        /* 6-WEEK MODULES ROADMAP GRID */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .module-card {
            background-color: var(--bg-card);
            padding: 2.2rem;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .module-card:hover {
            transform: translateY(-4px);
            border-color: var(--teal-light);
            box-shadow: 0 10px 25px rgba(45, 212, 191, 0.05);
        }

        .module-num {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--coral-excite);
            margin-bottom: 0.5rem;
        }

        .module-card h3 {
            color: var(--text-light);
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .module-focus-tag {
            color: var(--teal-light);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-card p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Herbal Integration Elements */
        .herbal-protocol-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(45, 212, 191, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .herbal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            color: var(--sage-soothe);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .herbal-instruction {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.4;
        }

        .worksheet-download-btn {
            background: rgba(13, 148, 136, 0.15);
            color: var(--teal-light);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid rgba(45, 212, 191, 0.2);
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }

        .worksheet-download-btn:hover {
            background: var(--teal-calm);
            color: white;
            border-color: var(--teal-calm);
        }

        /* Strategy Vault Gated Text Styling */
        .vault-guide-content {
            text-align: left;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 0.5rem;
            margin-top: 1rem;
        }

        .vault-guide-content h3 {
            color: var(--teal-light);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.25rem;
        }

        .vault-guide-content h4 {
            color: var(--coral-excite);
            margin-top: 1rem;
            margin-bottom: 0.25rem;
        }

        .vault-guide-content p, .vault-guide-content ul {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .vault-guide-content ul {
            padding-left: 1.25rem;
        }

        .vault-guide-content .ef-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .vault-guide-content .ef-table th, .vault-guide-content .ef-table td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem;
            text-align: left;
        }

        .vault-guide-content .ef-table th {
            background: rgba(13, 148, 136, 0.2);
            color: var(--teal-light);
        }

        .vault-guide-content .highlight-box {
            background: rgba(249, 115, 22, 0.05);
            border-left: 3px solid var(--coral-excite);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0;
        }

        /* Popup Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            position: relative;
            border: 2px solid var(--coral-excite);
            text-align: center;
            transition: max-width 0.3s ease;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: white;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: var(--bg-dark);
            color: white;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: 2px solid var(--teal-light);
        }
