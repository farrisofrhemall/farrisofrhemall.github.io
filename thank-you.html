<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Guide is Ready! | The ADHD Herbalist</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --teal-light: #4ade80; /* Adjust to match your theme's exact green/teal color */
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--teal-light);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .download-btn {
            display: block;
            background: var(--teal-light);
            color: #0d1117;
            text-decoration: none;
            padding: 1rem;
            font-weight: bold;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }
        .download-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Your Guide is Ready! ✨</h1>
        <p>Thank you for signing up. Click the button below to instantly view, read, and save your copy of <strong>The ADHD Herbalist Woman's Guide</strong>.</p>
        
        <a href="The_ADHD_Herbalist_Womans_Guide.pdf" target="_blank" class="download-btn">
            Open & Download PDF Guide
        </a>
    </div>

</body>
</html>
